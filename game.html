<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BJJ Card Game</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap">
<style>
  :root {
    --mat: #1c2b4a;
    --mat-dark: #131e36;
    --belt: #f1eee6;
    --gi-red: #b8434f;
    --gold: #d9a441;
    --ink: #10182b;
    --dim: #8d9ab8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 20px 14px 40px;
    background: var(--mat-dark); color: var(--belt);
    font-family: "Heebo", "Arial Hebrew", Arial, sans-serif;
  }
  main { max-width: 900px; margin: 0 auto; display: grid; gap: 18px; }
  h1 { margin: 0; font-size: 1.5rem; font-weight: 800; }
  .player, .table {
    background: var(--mat); border-radius: 10px; padding: 14px 16px;
  }
  .player-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; gap: 12px; flex-wrap: wrap;
  }
  .player-name { font-weight: 800; font-size: 1.15rem; }
  .position {
    background: var(--gold); color: var(--ink); font-weight: 800;
    padding: 4px 12px; border-radius: 999px; font-size: 0.95rem;
  }
  .hand { display: grid; grid-template-columns: repeat(5, minmax(0, 150px)); justify-content: center; gap: 8px; }
  .card {
    position: relative; aspect-ratio: 1131 / 1600;
    border-radius: 8px; overflow: hidden; background: #fff;
  }
  .card img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .card.unplayable { opacity: 0.5; filter: grayscale(1); }
  .card.interactive { cursor: pointer; transition: transform 0.12s ease; }
  .card.interactive:hover { transform: translateY(-4px); }
  .card.interactive:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .score {
    background: var(--belt); color: var(--ink); font-weight: 800;
    padding: 4px 12px; border-radius: 999px; font-size: 0.95rem;
  }
  .card-points {
    position: absolute; top: 8px; left: 8px; min-width: 24px; height: 24px; padding: 0 6px;
    display: flex; align-items: center; justify-content: center;
    background: var(--gold); color: var(--ink); font-weight: 800; font-size: 0.85rem;
    border-radius: 999px; box-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .status { text-align: center; min-height: 3.2em; }
  .status-turn { font-weight: 800; font-size: 1.1rem; color: var(--gold); }
  .status-log { color: var(--dim); font-size: 0.9rem; margin-top: 4px; }
  .new-game {
    margin-top: 10px; padding: 8px 22px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--gold); color: var(--ink); font: 800 1rem "Heebo", Arial, sans-serif;
  }

  /* Face-down card: dark belt-stripe pattern, clearly different from a face-up card */
  .card-back {
    aspect-ratio: 1131 / 1600; border-radius: 8px;
    border: 2px solid var(--belt);
    background:
      repeating-linear-gradient(45deg, var(--gi-red) 0 8px, var(--mat-dark) 8px 16px);
    display: flex; align-items: center; justify-content: center;
    user-select: none;
  }
  .card-back span {
    background: var(--mat-dark); color: var(--belt);
    font-size: 0.72rem; font-weight: 600;
    padding: 3px 8px; border-radius: 999px;
  }
  .table { display: flex; justify-content: center; gap: 28px; flex-wrap: wrap; }
  .pile { text-align: center; }
  .pile-card { width: 84px; margin: 0 auto 8px; }
  .pile-card .card-points { font-size: 0.65rem; min-width: 18px; height: 18px; top: 5px; left: 5px; }
  .pile-card .card-back span { font-size: 0.62rem; padding: 2px 6px; }
  .card-back.pile-empty {
    background: var(--mat-dark); border-style: dashed; border-color: var(--dim);
  }
  .card-back.pile-empty span { background: transparent; color: var(--dim); }
  .pile-count { font-size: 2rem; font-weight: 800; }
  .pile-label { color: var(--dim); font-size: 0.85rem; }
  @media (max-width: 520px) {
    .hand { grid-template-columns: repeat(3, minmax(0, 150px)); }
  }
</style>
</head>
<body>
<main>
  <h1 id="game-title"></h1>
  <section class="player" id="player-2"></section>
  <section class="table" id="table"></section>
  <section class="status" id="status"></section>
  <section class="player" id="player-1"></section>
</main>

<script id="card-assets">
// Card face images (embedded so the game stays a single file)
const CARD_FACE_IMAGES = Object.freeze({
  ESCAPE_MOUNT: "./images/escape_mount.jpeg",
  ESCAPE_SIDE: "./images/escape_side.jpeg",
  SIDE_CONTROL: "./images/side.jpeg",
  TAKEDOWN: "./images/takedown.jpeg",
  MOUNT: "./images/mount.jpeg",
  SWEEP: "./images/sweep.jpeg",
  GUARD_ESCAPE: "./images/escape_guard.jpeg",
  GUARD: "./images/guard.jpeg"
});
</script>
<script id="game-config">
// ============================================================
// Game configuration: every constant number and every UI word.
// Code identifiers and state IDs stay in English; UI text is Hebrew.
// ============================================================

// ---------- State IDs ----------
const Position = Object.freeze({
  STANDING: "STANDING",
  ON_BACK: "ON_BACK",
  KNEES: "KNEES",
  MOUNT_CONTROL: "MOUNT_CONTROL",
  SIDE_CONTROL: "SIDE_CONTROL",
  GUARD_CONTROL: "GUARD_CONTROL",
  IN_GUARD: "IN_GUARD",
});

// ---------- Numbers and IDs ----------
const HAND_SIZE = 5;
const COPIES_PER_CARD = 8;
const HUMAN_ID = "P1";
const COMPUTER_ID = "P2";
const COMPUTER_DELAY_MS = 1000;
// Game ends when a player reaches this score.
const WINNING_SCORE = 15;

const CARD_POINTS = Object.freeze({
  TAKEDOWN: 2,
  MOUNT: 4,
  SIDE_CONTROL: 3,
  ESCAPE_SIDE: 0,
  ESCAPE_MOUNT: 0,
  GUARD: 0,
  GUARD_ESCAPE: 0,
  // Cheaper than a direct Mount (4): the recurring MOUNT_CONTROL_BONUS still
  // applies afterward since the result is the same MOUNT_CONTROL position.
  SWEEP: 2,
});

// Bonus for still holding MOUNT_CONTROL after the opponent's turn ends.
const MOUNT_CONTROL_BONUS = 4;

// ---------- UI text (Hebrew) ----------
const POSITION_LABELS = Object.freeze({
  [Position.STANDING]: "על הרגליים",
  [Position.ON_BACK]: "על הגב",
  [Position.KNEES]: "על הברכיים",
  [Position.MOUNT_CONTROL]: "בשליטת מאונט",
  [Position.SIDE_CONTROL]: "בשליטת סייד",
  [Position.GUARD_CONTROL]: "בשליטת גארד",
  [Position.IN_GUARD]: "בתוך גארד",
});

const CARD_TEXT = Object.freeze({
  TAKEDOWN: { displayName: "הפלה", ruleText: "שניכם עומדים ← היריב על הגב" },
  MOUNT: { displayName: "מאונט", ruleText: "היריב על הגב, אתה לא על הגב ← שליטת מאונט" },
  SIDE_CONTROL: { displayName: "סייד", ruleText: "היריב על הגב, אתה לא על הגב ← שליטת סייד" },
  ESCAPE_SIDE: { displayName: "יציאה מסייד", ruleText: "אתה על הגב, היריב בשליטת סייד ← שניכם על הברכיים" },
  ESCAPE_MOUNT: { displayName: "יציאה ממאונט", ruleText: "אתה על הגב, היריב בשליטת מאונט ← שניכם על הברכיים" },
  GUARD: { displayName: "גארד", ruleText: "אתה על הגב/על הברכיים, היריב על הברכיים ← אתה בשליטת גארד, היריב בתוך גארד" },
  GUARD_ESCAPE: { displayName: "יציאה מגארד", ruleText: "אתה בתוך גארד, היריב בשליטת גארד ← אתה על הברכיים, היריב על הגב" },
  SWEEP: { displayName: "סוויפ", ruleText: "אתה בשליטת גארד, היריב בתוך גארד ← אתה בשליטת מאונט, היריב על הגב" },
});

const UI_TEXT = Object.freeze({
  pageTitle: "BJJ Card Game",
  gameTitle: "משחק קלפי BJJ",
  humanName: "אתה",
  computerName: "המחשב",
  hiddenCard: "קלף מוסתר",
  newGame: "משחק חדש",
  drawPileLabel: "חפיסת משיכה",
  discardPileLabel: "קלפים שנזרקו",
  pointsToWinLabel: "נקודות לניצחון",
  score: (points) => `${points} נקודות`,
  turn: {
    computer: "התור של המחשב...",
    humanPlay: "התור שלך: שחק קלף",
    humanDiscard: "התור שלך: אין קלף חוקי, בחר קלף לזרוק",
  },
  gameOver: {
    human: "ניצחת! המשחק נגמר",
    computer: "המחשב ניצח! המשחק נגמר",
  },
  log: {
    humanPlayed: (cardName, points) => `שיחקת: ${cardName} (+${points})`,
    computerPlayed: (cardName, points) => `המחשב שיחק: ${cardName} (+${points})`,
    humanDiscarded: "זרקת קלף והחלפת",
    computerDiscarded: "המחשב זרק קלף והחליף",
    computerNoCards: "למחשב אין קלפים",
    mountBonus: (name, points) => `${name} ממשיך לשלוט במאונט (+${points})`,
  },
  emptyPile: "ריק",
});
</script>
<script>
"use strict";

// ---------- Card definitions ----------
// Each definition is data + two pure functions:
//   canPlay(myState, opponentState) -> boolean
//   getResult(myState, opponentState) -> { myState, opponentState }

const CARD_DEFINITIONS = Object.freeze({
  TAKEDOWN: {
    id: "TAKEDOWN",
    displayName: CARD_TEXT.TAKEDOWN.displayName,
    ruleText: CARD_TEXT.TAKEDOWN.ruleText,
    points: CARD_POINTS.TAKEDOWN,
    faceImage: CARD_FACE_IMAGES.TAKEDOWN,
    // Both players standing.
    canPlay: (myState, opponentState) =>
      myState === Position.STANDING && opponentState === Position.STANDING,
    getResult: () => ({
      myState: Position.STANDING,
      opponentState: Position.ON_BACK,
    }),
  },
  MOUNT: {
    id: "MOUNT",
    displayName: CARD_TEXT.MOUNT.displayName,
    ruleText: CARD_TEXT.MOUNT.ruleText,
    points: CARD_POINTS.MOUNT,
    faceImage: CARD_FACE_IMAGES.MOUNT,
    // Opponent on their back, and you are standing, on your knees, or already in side control.
    canPlay: (myState, opponentState) =>
      opponentState === Position.ON_BACK &&
      (myState === Position.STANDING ||
        myState === Position.KNEES ||
        myState === Position.SIDE_CONTROL),
    getResult: () => ({
      myState: Position.MOUNT_CONTROL,
      opponentState: Position.ON_BACK,
    }),
  },
  SIDE_CONTROL: {
    id: "SIDE_CONTROL",
    displayName: CARD_TEXT.SIDE_CONTROL.displayName,
    ruleText: CARD_TEXT.SIDE_CONTROL.ruleText,
    points: CARD_POINTS.SIDE_CONTROL,
    faceImage: CARD_FACE_IMAGES.SIDE_CONTROL,
    // Opponent on their back, and you are standing, on your knees, already mounted, or already in guard control.
    canPlay: (myState, opponentState) =>
      opponentState === Position.ON_BACK &&
      (myState === Position.STANDING ||
        myState === Position.KNEES ||
        myState === Position.MOUNT_CONTROL ||
        myState === Position.GUARD_CONTROL),
    getResult: () => ({
      myState: Position.SIDE_CONTROL,
      opponentState: Position.ON_BACK,
    }),
  },
  ESCAPE_SIDE: {
    id: "ESCAPE_SIDE",
    displayName: CARD_TEXT.ESCAPE_SIDE.displayName,
    ruleText: CARD_TEXT.ESCAPE_SIDE.ruleText,
    points: CARD_POINTS.ESCAPE_SIDE,
    faceImage: CARD_FACE_IMAGES.ESCAPE_SIDE,
    // You are on your back, pinned in the opponent's side control.
    canPlay: (myState, opponentState) =>
      myState === Position.ON_BACK && opponentState === Position.SIDE_CONTROL,
    getResult: () => ({
      myState: Position.KNEES,
      opponentState: Position.KNEES,
    }),
  },
  ESCAPE_MOUNT: {
    id: "ESCAPE_MOUNT",
    displayName: CARD_TEXT.ESCAPE_MOUNT.displayName,
    ruleText: CARD_TEXT.ESCAPE_MOUNT.ruleText,
    points: CARD_POINTS.ESCAPE_MOUNT,
    faceImage: CARD_FACE_IMAGES.ESCAPE_MOUNT,
    // You are on your back, pinned under the opponent's mount.
    canPlay: (myState, opponentState) =>
      myState === Position.ON_BACK && opponentState === Position.MOUNT_CONTROL,
    getResult: () => ({
      myState: Position.KNEES,
      opponentState: Position.KNEES,
    }),
  },
  GUARD: {
    id: "GUARD",
    displayName: CARD_TEXT.GUARD.displayName,
    ruleText: CARD_TEXT.GUARD.ruleText,
    points: CARD_POINTS.GUARD,
    faceImage: CARD_FACE_IMAGES.GUARD,
    // Either you're on your back and the opponent is on their knees trying to
    // pass, or you're both on your knees and you close guard first.
    canPlay: (myState, opponentState) =>
      (myState === Position.ON_BACK && opponentState === Position.KNEES) ||
      (myState === Position.KNEES && opponentState === Position.KNEES),
    getResult: () => ({
      myState: Position.GUARD_CONTROL,
      opponentState: Position.IN_GUARD,
    }),
  },
  GUARD_ESCAPE: {
    id: "GUARD_ESCAPE",
    displayName: CARD_TEXT.GUARD_ESCAPE.displayName,
    ruleText: CARD_TEXT.GUARD_ESCAPE.ruleText,
    points: CARD_POINTS.GUARD_ESCAPE,
    faceImage: CARD_FACE_IMAGES.GUARD_ESCAPE,
    // You're stuck in the opponent's guard and posture up to break free.
    canPlay: (myState, opponentState) =>
      myState === Position.IN_GUARD && opponentState === Position.GUARD_CONTROL,
    getResult: () => ({
      myState: Position.KNEES,
      opponentState: Position.ON_BACK,
    }),
  },
  SWEEP: {
    id: "SWEEP",
    displayName: CARD_TEXT.SWEEP.displayName,
    ruleText: CARD_TEXT.SWEEP.ruleText,
    points: CARD_POINTS.SWEEP,
    faceImage: CARD_FACE_IMAGES.SWEEP,
    // From guard control, you reverse the opponent straight into mount.
    canPlay: (myState, opponentState) =>
      myState === Position.GUARD_CONTROL && opponentState === Position.IN_GUARD,
    getResult: () => ({
      myState: Position.MOUNT_CONTROL,
      opponentState: Position.ON_BACK,
    }),
  },
});

// ---------- Deck helpers ----------

let nextCardInstanceId = 1;

function createCard(definitionId) {
  return { instanceId: nextCardInstanceId++, definitionId };
}

function createDeck() {
  const deck = [];
  for (const definitionId of Object.keys(CARD_DEFINITIONS)) {
    for (let i = 0; i < COPIES_PER_CARD; i++) deck.push(createCard(definitionId));
  }
  return deck;
}

// Fisher-Yates, returns a new array
function shuffle(cards) {
  const result = [...cards];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

function drawCards(gameState, player, count) {
  for (let i = 0; i < count; i++) {
    if (gameState.drawPile.length === 0) {
      // Draw pile exhausted: recycle the discard pile
      gameState.drawPile = shuffle(gameState.discardPile);
      gameState.discardPile = [];
    }
    if (gameState.drawPile.length === 0) return; // nothing left anywhere
    player.hand.push(gameState.drawPile.pop());
  }
}

// ---------- Game state ----------

function createPlayer(id, name) {
  return { id, name, hand: [], position: Position.STANDING, score: 0 };
}

function createGameState() {
  const gameState = {
    drawPile: shuffle(createDeck()),
    discardPile: [],
    currentPlayerId: HUMAN_ID,
    winnerId: null,
    lastActionText: "",
    players: [createPlayer(HUMAN_ID, UI_TEXT.humanName), createPlayer(COMPUTER_ID, UI_TEXT.computerName)],
  };
  gameState.players.forEach((player) => drawCards(gameState, player, HAND_SIZE));
  return gameState;
}

// ---------- Rendering ----------

function renderCard(card, playable) {
  const def = CARD_DEFINITIONS[card.definitionId];
  const el = document.createElement("div");
  el.className = "card" + (playable ? "" : " unplayable");
  el.dataset.instanceId = card.instanceId;
  el.dataset.definitionId = def.id;
  el.title = def.ruleText;
  el.innerHTML = `<img src="${def.faceImage}" alt="${def.displayName}" draggable="false">
                  <span class="card-points">${def.points}</span>`;
  return el;
}

// Face-down card: intentionally exposes no definition info (no data-definition-id, no name).
function renderCardBack(card) {
  const el = document.createElement("div");
  el.className = "card-back";
  el.dataset.instanceId = card.instanceId;
  el.setAttribute("aria-label", UI_TEXT.hiddenCard);
  el.innerHTML = `<span>${UI_TEXT.hiddenCard}</span>`;
  return el;
}

// ---------- Card playing ----------

// Plays a card from a player's hand. Returns true if the card was played.
function playCard(gameState, playerId, cardInstanceId) {
  const player = gameState.players.find((p) => p.id === playerId);
  const opponent = gameState.players.find((p) => p.id !== playerId);
  if (!player || !opponent) return false;

  const cardIndex = player.hand.findIndex((c) => c.instanceId === cardInstanceId);
  if (cardIndex === -1) return false;

  const card = player.hand[cardIndex];
  const definition = CARD_DEFINITIONS[card.definitionId];
  if (!definition.canPlay(player.position, opponent.position)) return false;

  // 1. Apply state transition
  const result = definition.getResult(player.position, opponent.position);
  player.position = result.myState;
  opponent.position = result.opponentState;

  // 2. Score
  player.score += definition.points;

  // 3. Move card to discard pile and refill hand back to HAND_SIZE
  player.hand.splice(cardIndex, 1);
  gameState.discardPile.push(card);
  drawCards(gameState, player, HAND_SIZE - player.hand.length);

  return true;
}

// ---------- Turns ----------

function getLegalCards(player, opponent) {
  return player.hand.filter((card) =>
    CARD_DEFINITIONS[card.definitionId].canPlay(player.position, opponent.position)
  );
}

function hasLegalCard(player, opponent) {
  return getLegalCards(player, opponent).length > 0;
}

// Throws a card away and draws a replacement. Only allowed by takeTurnAction when no legal card exists.
function discardCard(gameState, player, cardInstanceId) {
  const cardIndex = player.hand.findIndex((c) => c.instanceId === cardInstanceId);
  if (cardIndex === -1) return false;
  const [card] = player.hand.splice(cardIndex, 1);
  drawCards(gameState, player, 1); // draw first so the thrown card can't come straight back
  gameState.discardPile.push(card);
  return true;
}

// One action per turn: play a legal card, or (only if no legal card) throw a card away.
// Ends the turn on success. Returns true if the action was taken.
function takeTurnAction(gameState, playerId, cardInstanceId) {
  if (gameState.winnerId || gameState.currentPlayerId !== playerId) return false;
  const player = gameState.players.find((p) => p.id === playerId);
  const opponent = gameState.players.find((p) => p.id !== playerId);
  const card = player.hand.find((c) => c.instanceId === cardInstanceId);
  if (!card) return false;

  const definition = CARD_DEFINITIONS[card.definitionId];
  const isHuman = playerId === HUMAN_ID;

  if (playCard(gameState, playerId, cardInstanceId)) {
    const playedText = isHuman ? UI_TEXT.log.humanPlayed : UI_TEXT.log.computerPlayed;
    gameState.lastActionText = playedText(definition.displayName, definition.points);
  } else if (!hasLegalCard(player, opponent) && discardCard(gameState, player, cardInstanceId)) {
    gameState.lastActionText = isHuman ? UI_TEXT.log.humanDiscarded : UI_TEXT.log.computerDiscarded;
  } else {
    return false;
  }

  // Bonus: the opponent (relative to this actor) keeps their mount through this whole turn
  if (opponent.position === Position.MOUNT_CONTROL) {
    opponent.score += MOUNT_CONTROL_BONUS;
    gameState.lastActionText += " | " + UI_TEXT.log.mountBonus(opponent.name, MOUNT_CONTROL_BONUS);
  }

  // Win check: first player to reach WINNING_SCORE ends the game (no next turn)
  const winner = gameState.players.find((p) => p.score >= WINNING_SCORE);
  if (winner) {
    gameState.winnerId = winner.id;
    return true;
  }

  gameState.currentPlayerId = opponent.id;
  return true;
}

function pickRandom(items) {
  return items[Math.floor(Math.random() * items.length)];
}

// Computer sees its own hand: plays the most valuable legal card, otherwise throws a random one.
function chooseComputerCard(gameState) {
  const player = gameState.players.find((p) => p.id === COMPUTER_ID);
  const opponent = gameState.players.find((p) => p.id === HUMAN_ID);
  const legalCards = getLegalCards(player, opponent);
  if (legalCards.length > 0) {
    const pointsOf = (card) => CARD_DEFINITIONS[card.definitionId].points;
    const bestPoints = Math.max(...legalCards.map(pointsOf));
    return pickRandom(legalCards.filter((card) => pointsOf(card) === bestPoints));
  }
  return pickRandom(player.hand) ?? null;
}

function playComputerTurn() {
  if (gameState.winnerId || gameState.currentPlayerId !== COMPUTER_ID) return;
  const card = chooseComputerCard(gameState);
  if (card) {
    takeTurnAction(gameState, COMPUTER_ID, card.instanceId);
  } else {
    gameState.currentPlayerId = HUMAN_ID; // empty hand: pass
    gameState.lastActionText = UI_TEXT.log.computerNoCards;
  }
  render(gameState);
}

function handlePlayerCardClick(cardInstanceId) {
  if (!takeTurnAction(gameState, HUMAN_ID, cardInstanceId)) return;
  render(gameState);
  if (!gameState.winnerId) setTimeout(playComputerTurn, COMPUTER_DELAY_MS);
}

function startNewGame() {
  gameState = createGameState();
  render(gameState);
}

function renderPlayer(containerId, player, opponent, { hideHand = false } = {}) {
  const container = document.getElementById(containerId);
  container.innerHTML = `
    <div class="player-head">
      <span class="player-name">${player.name}</span>
      <span class="position">${POSITION_LABELS[player.position]}</span>
      <span class="score">${UI_TEXT.score(player.score)}</span>
    </div>
    <div class="hand"></div>`;
  const handEl = container.querySelector(".hand");
  for (const card of player.hand) {
    if (hideHand) {
      handEl.appendChild(renderCardBack(card));
      continue;
    }
    const def = CARD_DEFINITIONS[card.definitionId];
    const playable = def.canPlay(player.position, opponent.position);
    const mustDiscard = !hasLegalCard(player, opponent);
    const clickable =
      !gameState.winnerId && gameState.currentPlayerId === player.id && (playable || mustDiscard);
    const cardEl = renderCard(card, playable || mustDiscard);
    if (clickable) {
      cardEl.classList.add("interactive");
      cardEl.tabIndex = 0;
      cardEl.setAttribute("role", "button");
      cardEl.addEventListener("click", () => handlePlayerCardClick(card.instanceId));
      cardEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          handlePlayerCardClick(card.instanceId);
        }
      });
    }
    handEl.appendChild(cardEl);
  }
}

// The draw pile grows/shrinks from the end of the array (push/pop), so its
// "top" card - the next one to be drawn - is the last element.
function renderPileVisual(topCard, { hidden }) {
  if (!topCard) {
    return `<div class="card-back pile-empty"><span>${UI_TEXT.emptyPile}</span></div>`;
  }
  return hidden ? renderCardBack(topCard).outerHTML : renderCard(topCard, true).outerHTML;
}

function renderTable(gameState) {
  const drawTopCard = gameState.drawPile[gameState.drawPile.length - 1] ?? null;
  const discardTopCard = gameState.discardPile[gameState.discardPile.length - 1] ?? null;
  document.getElementById("table").innerHTML = `
    <div class="pile">
      <div class="pile-card">${renderPileVisual(drawTopCard, { hidden: true })}</div>
      <div class="pile-count">${gameState.drawPile.length}</div>
      <div class="pile-label">${UI_TEXT.drawPileLabel}</div>
    </div>
    <div class="pile">
      <div class="pile-card">${renderPileVisual(discardTopCard, { hidden: false })}</div>
      <div class="pile-count">${gameState.discardPile.length}</div>
      <div class="pile-label">${UI_TEXT.discardPileLabel}</div>
    </div>
    <div class="pile">
      <div class="pile-count">${WINNING_SCORE}</div>
      <div class="pile-label">${UI_TEXT.pointsToWinLabel}</div>
    </div>`;
}

function renderStatus(gameState) {
  const human = gameState.players.find((p) => p.id === HUMAN_ID);
  const computer = gameState.players.find((p) => p.id === COMPUTER_ID);
  let turnText;
  if (gameState.winnerId) {
    turnText = gameState.winnerId === HUMAN_ID ? UI_TEXT.gameOver.human : UI_TEXT.gameOver.computer;
  } else if (gameState.currentPlayerId === COMPUTER_ID) {
    turnText = UI_TEXT.turn.computer;
  } else if (hasLegalCard(human, computer)) {
    turnText = UI_TEXT.turn.humanPlay;
  } else {
    turnText = UI_TEXT.turn.humanDiscard;
  }
  document.getElementById("status").innerHTML = `
    <div class="status-turn">${turnText}</div>
    <div class="status-log">${gameState.lastActionText}</div>
    ${gameState.winnerId ? `<button class="new-game" onclick="startNewGame()">${UI_TEXT.newGame}</button>` : ""}`;
}

function render(gameState) {
  const [player1, player2] = gameState.players;
  renderPlayer("player-2", player2, player1, { hideHand: true });
  renderTable(gameState);
  renderStatus(gameState);
  renderPlayer("player-1", player1, player2);
}

// ---------- Init ----------

function applyStaticText() {
  document.title = UI_TEXT.pageTitle;
  document.getElementById("game-title").textContent = UI_TEXT.gameTitle;
}

applyStaticText();
let gameState = createGameState();
render(gameState);
</script>
